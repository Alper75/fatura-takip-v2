steps:
  # 1. Docker İmajını Derle
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/fatura-app:$COMMIT_SHA', '.']

  # 2. Container Registry'e Yükle
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/fatura-app:$COMMIT_SHA']

  # 3. Cloud Run Üzerine Deploy Et
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'fatura-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/fatura-app:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'TURSO_URL=libsql://fatura-alper75.aws-eu-west-1.turso.io,PORT=8080'

images:
  - 'gcr.io/$PROJECT_ID/fatura-app:$COMMIT_SHA'
